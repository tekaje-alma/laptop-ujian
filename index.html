<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --graphite:#1B1D21; --slate:#5B6670; --paper:#E9EDEF; --card:#FFFFFF;
  --edge:#D2D9DD; --teal:#0F6E6B; --teal-dark:#0A5350;
  --green:#17864A; --amber:#C98A05; --red:#C0392B; --flag:#B32318;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--graphite);
  font:400 16px/1.5 Archivo,system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}

/* ---- topbar ---- */
.top{
  position:sticky;top:0;z-index:20;background:var(--graphite);color:#fff;
  margin:0 -16px 16px;padding:10px 16px;display:flex;align-items:center;gap:12px;
}
.top h1{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0;flex:1}
.top .sesi{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;
  text-transform:uppercase;color:#9AA6AD;display:block;margin-top:3px}
.back{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}

/* ---- kartu tag: elemen tanda tangan ---- */
.tag{
  position:relative;background:var(--card);border:1px solid var(--edge);
  border-radius:4px;overflow:hidden;margin-bottom:16px;
}
.tag::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--slate);
}
.tag[data-s="SIAP_PAKAI"]::before{background:var(--green)}
.tag[data-s="CADANGAN"]::before{background:var(--amber)}
.tag[data-s="SEDANG_DIGUNAKAN"]::before{background:var(--teal)}
.tag[data-s="RUSAK"]::before,.tag[data-s="AKSESORIS_HILANG"]::before{background:var(--red)}
.tag-head{
  padding:16px 16px 14px 26px;border-bottom:1px dashed var(--edge);
  display:flex;align-items:flex-start;gap:12px;
}
.tag-id{font:600 30px/1 'IBM Plex Mono',monospace;letter-spacing:-.01em;flex:1}
.tag-meta{font-size:13px;color:var(--slate);margin-top:6px;line-height:1.4}
.hole{width:16px;height:16px;border-radius:50%;border:1px solid var(--edge);
  background:var(--paper);flex:none;margin-top:6px}
.tag-body{padding:14px 16px 16px 26px}

.pill{display:inline-block;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;
  text-transform:uppercase;padding:6px 9px;border-radius:3px;color:#fff;background:var(--slate)}
.pill.SIAP_PAKAI{background:var(--green)} .pill.CADANGAN{background:var(--amber)}
.pill.SEDANG_DIGUNAKAN{background:var(--teal)} .pill.RUSAK{background:var(--red)}
.pill.AKSESORIS_HILANG{background:var(--flag)} .pill.BELUM_SETUP{background:var(--slate)}

/* ---- tipografi bantu ---- */
.eyebrow{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate);margin:24px 0 10px}
h2{font-size:20px;font-weight:700;margin:0 0 4px}
.lead{color:var(--slate);font-size:14px;margin:0 0 18px}

/* ---- kontrol ---- */
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,select,textarea{
  width:100%;min-height:var(--tap);padding:12px 14px;font:400 16px Archivo,sans-serif;
  background:var(--card);border:1px solid var(--edge);border-radius:4px;color:var(--graphite);
}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:3px solid var(--teal);outline-offset:1px}
.btn{
  width:100%;min-height:var(--tap);border:0;border-radius:4px;cursor:pointer;
  font:600 16px Archivo,sans-serif;background:var(--teal);color:#fff;margin-top:18px;
}
.btn:active{background:var(--teal-dark)}
.btn.ghost{background:var(--card);color:var(--graphite);border:1px solid var(--edge)}
.btn.danger{background:var(--red)}
.btn.small{min-height:44px;font-size:14px;margin-top:8px}
.btn[disabled]{opacity:.5}

.check{display:flex;align-items:center;gap:14px;min-height:var(--tap);
  padding:0 14px;background:var(--card);border:1px solid var(--edge);
  border-radius:4px;margin-bottom:8px;cursor:pointer;font-weight:500}
.check input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--teal)}
.check.off{background:#FBEDEC;border-color:var(--red)}

.radio{display:flex;align-items:center;gap:14px;min-height:var(--tap);padding:0 14px;
  background:var(--card);border:1px solid var(--edge);border-radius:4px;
  margin-bottom:8px;cursor:pointer;font-weight:500}
.radio input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--teal)}

.menu-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--edge);border-radius:4px;
  padding:16px;margin-bottom:10px;cursor:pointer;font:500 16px Archivo,sans-serif;
  color:var(--graphite)}
.menu-item .n{font:600 12px/1 'IBM Plex Mono',monospace;color:var(--slate);
  letter-spacing:.06em;flex:none;width:56px}
.menu-item small{display:block;font-weight:400;font-size:13px;color:var(--slate);margin-top:2px}

/* ---- scanner ---- */
#reader{width:100%;border-radius:4px;overflow:hidden;background:#000;min-height:240px}
.hint{font-size:13px;color:var(--slate);margin-top:12px}

/* ---- notifikasi ---- */
.note{padding:14px 16px;border-radius:4px;font-size:14px;margin:16px 0;
  border-left:4px solid var(--slate);background:var(--card)}
.note.ok{border-left-color:var(--green)}
.note.err{border-left-color:var(--red);background:#FBEDEC}
.note.warn{border-left-color:var(--amber);background:#FDF6E6}

/* ---- autocomplete ---- */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--card);
  border:1px solid var(--edge);border-top:0;border-radius:0 0 4px 4px;max-height:260px;overflow:auto}
.ac-list button{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--paper);padding:14px;font:400 15px Archivo,sans-serif;cursor:pointer}
.ac-list button b{display:block;font-weight:600}
.ac-list button span{font-size:12px;color:var(--slate)}

/* ---- dashboard ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:4px;padding:14px}
.stat b{display:block;font:600 28px/1 'IBM Plex Mono',monospace}
.stat span{font:600 10px/1.3 'IBM Plex Mono',monospace;letter-spacing:.08em;
  text-transform:uppercase;color:var(--slate);display:block;margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--edge);border-radius:4px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--paper)}
th{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;
  text-transform:uppercase;color:var(--slate)}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){
  .tag{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
}
</style>
</head>
<body>
<div class="top">
  <button class="back hidden" id="btnBack" onclick="kembali()" aria-label="Kembali">&#8592;</button>
  <h1 id="judul">Manajemen Laptop Ujian<span class="sesi" id="sesiLabel"></span></h1>
</div>
<div class="wrap" id="app"></div>

<script>
var API = localStorage.getItem('apiUrl') || '';
var S = { pin:'', panitia:null, siswa:[], ruangan:[], sesi:{}, view:'login',
          mode:'', laptop:null, swapRusak:null, hasil:null,
          snapshot:{}, dimuat:0, ms:0, msServer:0 };

/* ---------- jembatan API ---------- */
function api(action, data){
  var body = Object.assign({action:action, pin:S.pin}, data||{});
  var t0 = Date.now();
  return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body), redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      S.ms = Date.now() - t0; S.msServer = j.ms || 0;
      if(!j.ok) throw new Error(j.pesan||'Gagal memproses.');
      return j;
    });
}
function sibuk(on, teks){
  var b = document.getElementById('btnAksi');
  if(!b) return;
  b.disabled = on; b.dataset.teks = b.dataset.teks || b.textContent;
  b.textContent = on ? (teks||'Menyimpan...') : b.dataset.teks;
}
function pesan(html, jenis){
  var n = document.getElementById('notif');
  if(n) n.innerHTML = html ? '<div class="note '+(jenis||'')+'">'+html+'</div>' : '';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- snapshot laptop di HP ---------- */
/* Seluruh data laptop diunduh sekali saat login, lalu setiap pemindaian
   dijawab dari memori HP. Server tetap yang memvalidasi saat menyimpan. */
function terapkanSnapshot(arr){
  var peta = {};
  (arr||[]).forEach(function(r){
    peta[r[0]] = { id:r[0], pemilik:r[1], kelasMaster:r[2], merk:r[3],
      ruangan:r[4], status:r[5],
      kelengkapan:{charger:!!(r[6]&1), mouse:!!(r[6]&2), mousepad:!!(r[6]&4), headset:!!(r[6]&8)},
      catatan:r[7],
      pengguna: r[8] ? {nis:r[8], nama:r[9], kelas:r[10]} : null,
      punyaSandi: !!r[11] };
  });
  S.snapshot = peta; S.dimuat = Date.now();
}
function umurSnapshot(){ return S.dimuat ? Math.round((Date.now()-S.dimuat)/1000) : -1; }
function perbaruiLokal(id, ubah){
  var L = S.snapshot[id]; if(!L) return;
  for(var k in ubah) L[k] = ubah[k];
}
function segarkan(diam){
  return api('snapshot').then(function(j){
    terapkanSnapshot(j.laptop); S.ruangan = j.ruangan; S.sesi = j.sesi;
    if(!diam) render();
  }).catch(function(e){ if(!diam) pesan(esc(e.message),'err'); });
}
function segarkanManual(btn){ btn.disabled = true; btn.textContent = 'Memuat...'; segarkan(false); }

/* ---------- navigasi ---------- */
var tumpukan = [];
function pergi(view){ tumpukan.push(S.view); S.view = view; render(); }
function kembali(){ hentikanScanner(); S.view = tumpukan.pop() || 'menu'; render(); }
function keMenu(){ hentikanScanner(); tumpukan = []; S.view='menu'; render(); }

function render(){
  hentikanScanner();
  document.getElementById('btnBack').classList.toggle('hidden', S.view==='menu'||S.view==='login');
  var jejak = '';
  if(S.panitia){
    jejak = (S.sesi.tanggal||'') + ' · ' + (S.sesi.sesi||'') + ' · ' + S.panitia.nama;
    if(S.ms) jejak += ' · ' + S.ms + 'ms';
  }
  document.getElementById('sesiLabel').textContent = jejak;
  var el = document.getElementById('app');
  el.innerHTML = ({
    konfig:v_konfig, login:v_login, menu:v_menu, scan:v_scan, inspeksi:v_inspeksi, mapping:v_mapping,
    swap:v_swap, checkout:v_checkout, hasil:v_hasil, dashboard:v_dashboard
  })[S.view]();
  window.scrollTo(0,0);
  if(S.view==='scan') mulaiScanner();
  if(S.view==='dashboard') muatDashboard();
  var f = document.getElementById('fokus'); if(f) f.focus();
}

/* ---------- 1. LOGIN ---------- */
function v_login(){
  return '<p class="eyebrow">Masuk</p><h2>PIN panitia</h2>'+
    '<p class="lead">Setiap tindakan tercatat atas nama pemilik PIN.</p>'+
    '<div id="notif"></div>'+
    '<input id="fokus" type="tel" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN" '+
    'onkeydown="if(event.key===\'Enter\')masuk()">'+
    '<button class="btn" id="btnAksi" onclick="masuk()">Masuk</button>'+
    '<button class="btn ghost small" onclick="lupakanAlamat()">Ganti alamat server</button>';
}
function masuk(){
  S.pin = document.getElementById('fokus').value.trim();
  sibuk(true,'Memeriksa...');
  api('bootstrap').then(function(j){
    S.panitia=j.panitia; S.siswa=j.siswa; S.ruangan=j.ruangan; S.sesi=j.sesi;
    terapkanSnapshot(j.laptop);
    keMenu();
  }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); });
}

/* ---------- 0. ALAMAT SERVER ---------- */
function v_konfig(){
  return '<p class="eyebrow">Pengaturan awal</p><h2>Alamat server</h2>'+
    '<p class="lead">Tempel Web app URL dari Apps Script. Cukup diisi sekali di tiap HP.</p>'+
    '<div id="notif"></div>'+
    '<input id="fokus" inputmode="url" autocomplete="off" '+
    'placeholder="https://script.google.com/macros/s/.../exec">'+
    '<button class="btn" id="btnAksi" onclick="simpanKonfig()">Simpan alamat</button>';
}
function simpanKonfig(){
  var u = document.getElementById('fokus').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
    pesan('Alamat harus Web app URL Apps Script dan berakhiran <b>/exec</b>.','err'); return;
  }
  try{ localStorage.setItem('apiUrl', u); }catch(e){}
  API = u; S.view = 'login'; render();
}
function lupakanAlamat(){
  try{ localStorage.removeItem('apiUrl'); }catch(e){}
  API=''; S.view='konfig'; render();
}

/* ---------- 2. MENU ---------- */
function v_menu(){
  var m = [
    ['Fase 1','Inspeksi ruangan','Tempatkan laptop, catat sandi &amp; kelengkapan','inspeksi'],
    ['Fase 2','Pasang siswa','Tautkan laptop ke siswa sesi ini','mapping'],
    ['Insiden','Tukar laptop','Ganti unit rusak dengan cadangan','swap'],
    ['Fase 3','Check-out','Periksa aksesoris sebelum siswa keluar','checkout']
  ].map(function(x){
    return '<button class="menu-item" onclick="mulaiMode(\''+x[3]+'\')">'+
      '<span class="n">'+x[0]+'</span><span>'+x[1]+'<small>'+x[2]+'</small></span></button>';
  }).join('');
  var admin = (S.panitia && S.panitia.peran==='admin')
    ? '<p class="eyebrow">Admin</p>'+
      '<button class="menu-item" onclick="pergi(\'dashboard\')"><span class="n">Pusat</span>'+
      '<span>Dashboard &amp; laporan<small>Rekap ruangan, unit rusak, aksesoris hilang</small></span></button>'
    : '';
  var umur = umurSnapshot();
  var kapan = umur < 0 ? 'belum dimuat'
            : umur < 60 ? umur + ' detik lalu'
            : Math.round(umur/60) + ' menit lalu';
  return '<p class="eyebrow">Alur ujian</p>'+m+admin+
    '<p class="eyebrow">Data</p>'+
    '<button class="btn ghost small" style="margin-top:0" onclick="segarkanManual(this)">'+
    Object.keys(S.snapshot).length+' laptop dimuat · '+kapan+' · Segarkan</button>'+
    '<button class="btn ghost small" onclick="location.reload()">Keluar</button>';
}
function mulaiMode(mode){
  S.mode=mode; S.laptop=null; S.swapRusak=null;
  pergi('scan');
  var umur = umurSnapshot();
  if(umur < 0 || umur > 90) segarkan(true);   // menyegarkan diam-diam sambil kamera menyala
}

/* ---------- 3. SCANNER ---------- */
var qr = null;
function v_scan(){
  var t = {inspeksi:'Scan laptop yang diinspeksi', mapping:'Scan laptop di meja siswa',
    swap: S.swapRusak ? 'Scan laptop CADANGAN' : 'Scan laptop yang RUSAK',
    checkout:'Scan laptop yang dikembalikan'}[S.mode];
  var konteks = (S.mode==='swap' && S.swapRusak)
    ? '<div class="note warn">Mengganti <b>'+esc(S.swapRusak.id)+'</b> milik '+
      esc(S.swapRusak.pengguna ? S.swapRusak.pengguna.nama : '-')+'</div>' : '';
  return '<p class="eyebrow">Pindai</p><h2>'+t+'</h2>'+konteks+
    '<div id="notif"></div><div id="reader"></div>'+
    '<p class="hint">Kamera bermasalah atau stiker rusak? Ketik ID laptopnya.</p>'+
    '<input id="fokus" placeholder="Contoh: LTP-001" autocapitalize="characters" '+
    'onkeydown="if(event.key===\'Enter\')kirimScan(this.value)">'+
    '<button class="btn ghost" id="btnAksi" onclick="kirimScan(document.getElementById(\'fokus\').value)">'+
    'Gunakan ID ini</button>';
}
function mulaiScanner(){
  var kotak = document.getElementById('reader');
  if(!kotak) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    gagalKamera('TidakDidukung'); return;
  }
  if(typeof Html5Qrcode==='undefined'){ gagalKamera('PustakaGagalDimuat'); return; }
  qr = new Html5Qrcode('reader');
  qr.start({facingMode:'environment'}, {fps:10, qrbox:{width:230,height:230}},
    function(teks){ hentikanScanner(); if(navigator.vibrate) navigator.vibrate(40); kirimScan(teks); },
    function(){}
  ).catch(function(err){
    gagalKamera((err && (err.name || err.message)) || 'TidakDiketahui');
  });
}
function gagalKamera(kode){
  var saran = {
    NotAllowedError:'Izin kamera diblokir. Kalau aplikasi ini dibuka lewat URL Apps Script, penyebabnya adalah iframe Google yang memang melarang kamera — perlu di-host sendiri.',
    NotFoundError:'Tidak ada kamera yang terdeteksi di perangkat ini.',
    NotReadableError:'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/video call lalu coba lagi.',
    TidakDidukung:'Browser ini tidak mengizinkan akses kamera. Buka lewat Chrome atau Safari, bukan browser di dalam WhatsApp/Instagram.',
    PustakaGagalDimuat:'Pustaka pemindai gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.'
  }[kode] || 'Buka lewat Chrome atau Safari langsung, bukan browser di dalam aplikasi lain.';
  var kotak = document.getElementById('reader');
  if(kotak) kotak.outerHTML = '<div class="note warn"><b>Kamera tidak bisa dibuka</b> '+
    '<span style="font:600 12px \'IBM Plex Mono\',monospace">('+esc(kode)+')</span><br>'+saran+
    '<br><br>Alur tetap bisa lanjut: ketik ID laptopnya di bawah.</div>';
}
function hentikanScanner(){
  if(qr){ try{ qr.stop().then(function(){ qr.clear(); }); }catch(e){} qr=null; }
}
function kirimScan(teks){
  var id = String(teks||'').trim().toUpperCase();
  if(!id){ pesan('Isi dulu ID laptopnya.','err'); return; }
  var L = S.snapshot[id];
  if(L){ S.ms = 0; S.msServer = 0; lanjutScan(L); return; }   // tanpa menunggu server
  sibuk(true,'Mencari...');
  api('scan',{id:id}).then(function(j){
    S.sesi = j.sesi; S.ruangan = j.ruangan;
    S.snapshot[j.laptop.id] = j.laptop;
    lanjutScan(j.laptop);
  }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); mulaiScanner(); });
}
function lanjutScan(L){
  if(S.mode==='swap' && !S.swapRusak){
    if(L.status!=='SEDANG_DIGUNAKAN'){
      sibuk(false);
      pesan('<b>'+esc(L.id)+'</b> tidak sedang dipakai siapa pun. '+
        'Scan laptop siswa yang bermasalah.','err');
      mulaiScanner(); return;
    }
    S.swapRusak = L; render(); return;
  }
  S.laptop = L; S.view = S.mode; render();
}

/* ---------- kartu tag ---------- */
function kartu(L, extra){
  var pemilik = String(L.pemilik||'').trim();
  var kelas = String(L.kelasMaster||'').trim();
  if(kelas === '-' || kelas === '0') kelas = '';
  var bagian = [];
  if(String(L.merk||'').trim()) bagian.push(esc(L.merk));
  if(pemilik) bagian.push('pemilik: '+esc(pemilik)+(kelas?' &middot; '+esc(kelas):''));
  else if(kelas) bagian.push('kelas '+esc(kelas));
  if(String(L.ruangan||'').trim()) bagian.push(esc(L.ruangan));
  return '<div class="tag" data-s="'+esc(L.status)+'">'+
    '<div class="tag-head"><div class="hole"></div><div class="tag-id">'+esc(L.id)+
    '<div class="tag-meta">'+(bagian.join(' &middot; ')||'&mdash;')+'</div></div>'+
    '<span class="pill '+esc(L.status)+'">'+esc(String(L.status).replace(/_/g,' '))+'</span></div>'+
    (extra?'<div class="tag-body">'+extra+'</div>':'')+'</div>';
}
function barisKelengkapan(k){
  var n = ['charger','mouse','mousepad','headset'].filter(function(x){return k[x];});
  return '<div class="tag-meta"><b>Kelengkapan tercatat:</b> '+(n.length?n.join(', '):'tidak ada')+'</div>';
}
function tombolSandi(id){
  return '<button class="btn ghost small" onclick="lihatSandi(\''+id+'\',this)">Lihat sandi laptop</button>';
}
function lihatSandi(id, btn){
  btn.disabled=true; btn.textContent='Membuka...';
  api('lihatSandi',{id:id}).then(function(j){
    btn.outerHTML = '<div class="note">Sandi <b>'+esc(id)+'</b>: '+
      '<span style="font:600 20px \'IBM Plex Mono\',monospace">'+esc(j.password||'(kosong)')+'</span></div>';
  }).catch(function(e){ btn.disabled=false; btn.textContent='Lihat sandi laptop'; alert(e.message); });
}

/* ---------- FASE 1 ---------- */
function v_inspeksi(){
  var L=S.laptop, k=L.kelengkapan;
  var opsi = S.ruangan.map(function(r){
    return '<option '+(L.ruangan===r?'selected':'')+'>'+esc(r)+'</option>'; }).join('');
  return '<p class="eyebrow">Fase 1 · Inspeksi</p>'+kartu(L)+'<div id="notif"></div>'+
    '<label for="ruang">Ruang ujian</label>'+
    '<select id="ruang"><option value="">Pilih ruangan</option>'+opsi+'</select>'+
    '<label>Kelengkapan yang ada di meja</label>'+
    ['charger','mouse','mousepad','headset'].map(function(x){
      return '<label class="check"><input type="checkbox" id="c_'+x+'" '+
        (k[x]||L.status==='BELUM_SETUP'?'checked':'')+'>'+
        x.charAt(0).toUpperCase()+x.slice(1)+'</label>'; }).join('')+
    '<label for="sandi">Sandi / PIN laptop</label>'+
    '<input id="sandi" autocomplete="off" placeholder="'+(L.punyaSandi?'Sudah tersimpan — isi untuk mengganti':'Contoh: 123456')+'">'+
    '<label for="catatan">Catatan kondisi</label>'+
    '<textarea id="catatan" placeholder="Contoh: baterai drop, harus colok charger terus">'+esc(L.catatan)+'</textarea>'+
    '<label>Status kelayakan</label>'+
    [['SIAP_PAKAI','Siap pakai','Aman dipakai siswa di ruangan ini'],
     ['CADANGAN','Cadangan','Disimpan di meja teknisi untuk penggantian'],
     ['RUSAK','Rusak / tarik ke ruang laptop','Tidak dipakai ujian']].map(function(x){
      return '<label class="radio"><input type="radio" name="kel" value="'+x[0]+'" '+
        (L.status===x[0]||(L.status==='BELUM_SETUP'&&x[0]==='SIAP_PAKAI')?'checked':'')+'>'+
        '<span>'+x[1]+'<small style="display:block;font-size:12px;color:var(--slate)">'+x[2]+'</small></span></label>';
     }).join('')+
    '<button class="btn" id="btnAksi" onclick="simpanInspeksi()">Simpan data laptop</button>';
}
function simpanInspeksi(){
  var d = {id:S.laptop.id, ruangan:document.getElementById('ruang').value,
    password:document.getElementById('sandi').value || (S.laptop.punyaSandi?undefined:''),
    catatan:document.getElementById('catatan').value,
    kelayakan:(document.querySelector('input[name=kel]:checked')||{}).value};
  if(d.password===undefined) delete d.password;
  ['charger','mouse','mousepad','headset'].forEach(function(x){
    d[x]=document.getElementById('c_'+x).checked; });
  sibuk(true);
  api('inspeksi',d).then(function(j){
    perbaruiLokal(S.laptop.id, { ruangan:j.ruangan, status:j.status, pengguna:null,
      catatan:d.catatan,
      kelengkapan:{charger:d.charger, mouse:d.mouse, mousepad:d.mousepad, headset:d.headset},
      punyaSandi: S.laptop.punyaSandi || (d.password !== undefined && d.password !== '') });
    S.hasil={judul:'Tersimpan', teks:j.pesan, jenis:'ok'}; S.view='hasil'; render();
  }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); });
}

/* ---------- FASE 2 ---------- */
function v_mapping(){
  var L=S.laptop;
  var isi = barisKelengkapan(L.kelengkapan)+tombolSandi(L.id);
  var terpasang = L.pengguna
    ? '<div class="note warn">Saat ini terpasang: <b>'+esc(L.pengguna.nama)+'</b> ('+esc(L.pengguna.kelas)+')</div>' : '';
  return '<p class="eyebrow">Fase 2 · Pasang siswa</p>'+kartu(L,isi)+terpasang+'<div id="notif"></div>'+
    '<label for="fokus">Nama siswa di meja ini</label>'+
    '<div class="ac"><input id="fokus" autocomplete="off" placeholder="Ketik 2 huruf nama" '+
    'oninput="cariSiswa(this.value)"><div id="aclist"></div></div>'+
    '<input type="hidden" id="nis">'+
    '<button class="btn" id="btnAksi" onclick="simpanMapping()">Simpan &amp; gunakan</button>';
}
function cariSiswa(q){
  var box=document.getElementById('aclist'); document.getElementById('nis').value='';
  q=q.trim().toLowerCase();
  if(q.length<2){ box.innerHTML=''; return; }
  var hasil=S.siswa.filter(function(r){
    return r[1].toLowerCase().indexOf(q)>-1 || r[0].indexOf(q)>-1; }).slice(0,25);
  box.innerHTML = hasil.length
    ? '<div class="ac-list">'+hasil.map(function(r){
        return '<button onclick="pilihSiswa(\''+r[0]+'\',\''+esc(r[1]).replace(/'/g,"\\'")+'\')">'+
          '<b>'+esc(r[1])+'</b><span>'+esc(r[2])+' · NIS '+esc(r[0])+'</span></button>'; }).join('')+'</div>'
    : '<div class="ac-list"><button disabled><b>Tidak ada yang cocok</b>'+
      '<span>Periksa ejaan atau cari pakai NIS</span></button></div>';
}
function pilihSiswa(nis,nama){
  document.getElementById('nis').value=nis;
  document.getElementById('fokus').value=nama;
  document.getElementById('aclist').innerHTML='';
}
function simpanMapping(){
  var nis=document.getElementById('nis').value;
  if(!nis){ pesan('Pilih nama siswa dari daftar yang muncul.','err'); return; }
  sibuk(true);
  api('mapping',{id:S.laptop.id, nis:nis}).then(function(j){
    perbaruiLokal(S.laptop.id, { status:'SEDANG_DIGUNAKAN', pengguna:j.pengguna });
    S.hasil={judul:'Terpasang', teks:j.pesan, jenis:'ok'}; S.view='hasil'; render();
  }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); });
}

/* ---------- QUICK SWAP ---------- */
function v_swap(){
  var A=S.swapRusak, B=S.laptop;
  return '<p class="eyebrow">Insiden · Tukar laptop</p>'+
    '<h2>Konfirmasi penggantian</h2>'+
    '<p class="lead">'+esc(A.pengguna?A.pengguna.nama:'-')+' di '+esc(A.ruangan)+
    ' akan berpindah ke unit cadangan.</p>'+kartu(A)+kartu(B, barisKelengkapan(B.kelengkapan))+
    '<div id="notif"></div><label>Alasan kendala</label>'+
    ['Mati total / baterai drop','Layar blank','Keyboard macet','Tidak bisa masuk aplikasi ujian','Lainnya']
      .map(function(x,i){ return '<label class="radio"><input type="radio" name="alasan" value="'+esc(x)+'" '+
        (i===0?'checked':'')+'>'+x+'</label>'; }).join('')+
    '<button class="btn danger" id="btnAksi" onclick="simpanSwap()">Konfirmasi tukar laptop</button>'+
    '<button class="btn ghost small" onclick="S.swapRusak=null;S.laptop=null;S.view=\'scan\';render()">Ulangi dari awal</button>';
}
function simpanSwap(){
  sibuk(true,'Memindahkan...');
  api('swap',{idRusak:S.swapRusak.id, idBaru:S.laptop.id,
    alasan:(document.querySelector('input[name=alasan]:checked')||{}).value})
    .then(function(j){
      perbaruiLokal(S.swapRusak.id, { status:'RUSAK', ruangan:'Ruang Laptop', pengguna:null });
      perbaruiLokal(S.laptop.id, { status:'SEDANG_DIGUNAKAN', ruangan:j.ruangan, pengguna:j.pengguna });
      var nama=['charger','mouse','mousepad','headset'].filter(function(x){return j.kelengkapan[x];});
      S.hasil={judul:'Laptop ditukar', jenis:'ok', teks:j.pesan,
        rinci:'Sandi '+S.laptop.id+': <b style="font-family:\'IBM Plex Mono\',monospace">'+
          esc(j.password||'(kosong)')+'</b><br>Kelengkapan yang diserahkan: '+
          (nama.length?nama.join(', '):'tidak ada')};
      S.view='hasil'; render();
    }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); });
}

/* ---------- FASE 3 ---------- */
function v_checkout(){
  var L=S.laptop;
  if(L.status!=='SEDANG_DIGUNAKAN'){
    return '<p class="eyebrow">Fase 3 · Check-out</p>'+kartu(L)+
      '<div class="note err">Laptop ini tidak sedang dipakai siapa pun, jadi tidak ada yang perlu diperiksa.</div>'+
      '<button class="btn" onclick="mulaiMode(\'checkout\')">Scan laptop lain</button>';
  }
  return '<p class="eyebrow">Fase 3 · Check-out</p>'+kartu(L)+
    '<div class="note">Pengguna sesi ini: <b>'+esc(L.pengguna.nama)+'</b> ('+esc(L.pengguna.kelas)+')</div>'+
    '<div id="notif"></div>'+
    '<label>Centang yang benar-benar ada di meja</label>'+
    ['charger','mouse','mousepad','headset'].map(function(x){
      if(!L.kelengkapan[x]) return '';
      return '<label class="check" onchange="this.classList.toggle(\'off\',!this.querySelector(\'input\').checked)">'+
        '<input type="checkbox" id="c_'+x+'" checked>'+x.charAt(0).toUpperCase()+x.slice(1)+'</label>';
    }).join('')+
    '<label for="catatan">Keterangan (opsional)</label>'+
    '<textarea id="catatan" placeholder="Contoh: headset ketinggalan di ruang sebelah"></textarea>'+
    '<button class="btn" id="btnAksi" onclick="simpanCheckout()">Selesaikan check-out</button>';
}
function simpanCheckout(){
  var d={id:S.laptop.id, catatan:document.getElementById('catatan').value};
  ['charger','mouse','mousepad','headset'].forEach(function(x){
    var el=document.getElementById('c_'+x); d[x]= el?el.checked:false; });
  sibuk(true,'Memeriksa...');
  api('checkout',d).then(function(j){
    perbaruiLokal(S.laptop.id, { status:j.status, pengguna:null,
      kelengkapan:{charger:d.charger, mouse:d.mouse, mousepad:d.mousepad, headset:d.headset} });
    S.hasil = j.hilang.length
      ? {judul:'Aksesoris hilang dilaporkan', jenis:'err', teks:j.pesan,
         rinci:'Item: <b>'+j.hilang.join(', ')+'</b><br>Penanggung jawab: '+esc(j.siswa)+
               '<br>Siswa ini otomatis ditandai di dashboard admin.'}
      : {judul:'Lengkap', jenis:'ok', teks:j.pesan, rinci:'Siswa dipersilakan keluar ruangan.'};
    S.view='hasil'; render();
  }).catch(function(e){ sibuk(false); pesan(esc(e.message),'err'); });
}

/* ---------- HASIL ---------- */
function v_hasil(){
  var h=S.hasil;
  return '<p class="eyebrow">Selesai</p><h2>'+esc(h.judul)+'</h2>'+
    '<div class="note '+h.jenis+'">'+esc(h.teks)+(h.rinci?'<br><br>'+h.rinci:'')+'</div>'+
    '<p class="hint">server '+S.msServer+' ms · bolak-balik '+S.ms+' ms</p>'+
    '<button class="btn" onclick="mulaiMode(S.mode)">Scan laptop berikutnya</button>'+
    '<button class="btn ghost small" onclick="keMenu()">Kembali ke menu</button>';
}

/* ---------- DASHBOARD ---------- */
function v_dashboard(){
  return '<p class="eyebrow">Admin</p><h2>Dashboard</h2>'+
    '<div id="notif"></div><div id="dash">Memuat data...</div>';
}
function muatDashboard(){
  api('dashboard').then(function(j){
    var urut=['SIAP_PAKAI','SEDANG_DIGUNAKAN','CADANGAN','RUSAK','AKSESORIS_HILANG','BELUM_SETUP'];
    var stat=urut.filter(function(k){return j.perStatus[k];}).map(function(k){
      return '<div class="stat"><b>'+j.perStatus[k]+'</b><span>'+k.replace(/_/g,' ')+'</span></div>'; }).join('');
    stat+='<div class="stat"><b>'+j.swapHariIni+'</b><span>Tukar hari ini</span></div>';

    var ruang='<table><tr><th>Ruangan</th><th>Isi</th></tr>'+
      Object.keys(j.perRuangan).map(function(r){
        return '<tr><td>'+esc(r)+'</td><td>'+Object.keys(j.perRuangan[r]).map(function(k){
          return k.replace(/_/g,' ').toLowerCase()+' '+j.perRuangan[r][k]; }).join(', ')+'</td></tr>';
      }).join('')+'</table>';

    var flag = j.flagSiswa.length
      ? '<table><tr><th>Siswa</th><th>Kelas</th><th>Item</th></tr>'+
        j.flagSiswa.map(function(f){ return '<tr><td>'+esc(f.nama)+'</td><td>'+esc(f.kelas)+
          '</td><td>'+f.jumlah+'</td></tr>'; }).join('')+'</table>'
      : '<div class="note ok">Tidak ada siswa yang ditandai. Semua aksesoris kembali.</div>';

    var lap = j.laporan.length
      ? j.laporan.map(function(l){
          return '<div class="tag" data-s="AKSESORIS_HILANG"><div class="tag-body">'+
            '<b>'+esc(l.item)+'</b> — '+esc(l.laptop)+' · '+esc(l.ruangan||'')+
            '<div class="tag-meta">'+esc(l.nama)+' ('+esc(l.kelas)+') · '+esc(l.tanggal)+' '+esc(l.sesi)+'</div>'+
            '<input class="ket" placeholder="Keterangan penyelesaian" style="margin-top:10px">'+
            '<button class="btn small" onclick="tutup(this,\''+l.id+'\')">Tutup laporan</button>'+
            '</div></div>'; }).join('')
      : '';

    var rusak = j.rusak.length
      ? '<table><tr><th>Unit</th><th>Catatan</th></tr>'+j.rusak.map(function(r){
          return '<tr><td>'+esc(r.id)+'</td><td>'+esc(r.catatan||'-')+'</td></tr>'; }).join('')+'</table>'
      : '<div class="note ok">Tidak ada unit rusak.</div>';

    document.getElementById('dash').innerHTML =
      '<div class="grid">'+stat+'</div>'+
      '<p class="eyebrow">Sebaran per ruangan</p>'+ruang+
      '<p class="eyebrow">Aksesoris hilang · belum selesai</p>'+(lap||'<div class="note ok">Kosong.</div>')+
      '<p class="eyebrow">Siswa bertanda</p>'+flag+
      '<p class="eyebrow">Unit rusak</p>'+rusak+
      '<p class="eyebrow">Sesi aktif</p>'+
      '<input id="dTanggal" type="date" value="'+esc(j.sesi.tanggal)+'">'+
      '<input id="dSesi" value="'+esc(j.sesi.sesi)+'" style="margin-top:8px">'+
      '<button class="btn" onclick="ubahSesi()">Simpan sesi aktif</button>';
  }).catch(function(e){ document.getElementById('dash').innerHTML='<div class="note err">'+esc(e.message)+'</div>'; });
}
function tutup(btn, id){
  var ket = btn.previousElementSibling.value.trim();
  if(!ket){ alert('Isi dulu keterangan penyelesaiannya.'); return; }
  btn.disabled=true; btn.textContent='Menutup...';
  api('tutupLaporan',{idLaporan:id, keterangan:ket})
    .then(muatDashboard)
    .catch(function(e){ btn.disabled=false; btn.textContent='Tutup laporan'; alert(e.message); });
}
function ubahSesi(){
  api('setSesi',{tanggal:document.getElementById('dTanggal').value,
                 sesi:document.getElementById('dSesi').value})
    .then(function(j){ S.sesi=j.sesi; render(); })
    .catch(function(e){ alert(e.message); });
}

S.view = API ? 'login' : 'konfig';
render();
</script>
</body>
</html>
